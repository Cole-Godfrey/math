<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Math</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/app.css">
  <script src="/graph.js" defer></script>
  <script src="/native.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="bar">
    <a class="brand" href="#" aria-label="Math home">
      <svg class="mark" viewBox="0 0 506 100" aria-hidden="true"><path d="M0 0L9 0L9 100L0 100ZM95 0L104 0L104 100L95 100ZM0 0L10.14 0L52 80.49L93.86 0L104 0L52 100ZM150 0L159.98 0L198 79.2L236.02 0L246 0L198 100ZM167.04 35.5L228.96 35.5L224.64 44.5L171.36 44.5ZM292 0L376 0L376 9L292 9ZM329.5 0L338.5 0L338.5 100L329.5 100ZM422 0L431 0L431 100L422 100ZM497 0L506 0L506 100L497 100ZM422 45.5L506 45.5L506 54.5L422 54.5Z"/></svg>
    </a>
    <nav class="bar-nav" aria-label="Sections">
      <a href="#view=browse" data-nav="browse">Browse</a>
      <a href="#view=graph" data-nav="graph">Graph</a>
      <a href="#view=guide" data-nav="guide">Contribute</a>
    </nav>
    <form id="bar-search" class="bar-search" role="search">
      <label class="sr-only" for="bar-query">Search</label>
      <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
      <input id="bar-query" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
      <kbd>/</kbd>
    </form>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to dark theme">
      <svg class="icon moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.6A5.5 5.5 0 1 1 6.4 2.5a4.5 4.5 0 0 0 7.1 7.1Z"/></svg>
      <svg class="icon sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5V3m0 10v1.5M1.5 8H3m10 0h1.5M3.4 3.4l1.06 1.06m7.08 7.08 1.06 1.06M3.4 12.6l1.06-1.06m7.08-7.08L12.6 3.4"/></svg>
    </button>
  </header>

  <div id="library-bar" class="library-bar" hidden>
    <label for="library">Proof library</label>
    <select id="library" aria-describedby="library-description"></select>
    <span id="library-description" class="muted"></span>
  </div>

  <main id="main">
    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="home-view" class="home" hidden>
      <div class="home-lead">
        <figure class="ring" id="ring">
          <svg class="ring-svg" viewBox="0 0 400 400" aria-hidden="true">
            <circle class="ring-track" cx="200" cy="200" r="188" pathLength="100" transform="rotate(-90 200 200)"/>
            <circle class="ring-value" id="ring-value" cx="200" cy="200" r="188" pathLength="100" transform="rotate(-90 200 200)"/>
          </svg>
          <h1 class="ring-label"><span class="ring-number" id="ring-number">–</span><span class="ring-caption">of mathematics formally verified</span></h1>
        </figure>
        <form id="search-home" class="home-search" role="search">
          <label class="sr-only" for="home-query">Search mathematics</label>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="home-query" type="search" placeholder="Search theorems and definitions" autocomplete="off" spellcheck="false">
          <kbd>/</kbd>
        </form>
        <p class="home-facts" id="home-facts"></p>
      </div>
      <section class="home-section" aria-labelledby="subjects-heading">
        <h2 id="subjects-heading">Subjects</h2>
        <div id="areas" class="areas"></div>
      </section>
      <section class="home-section" aria-labelledby="axioms-heading">
        <h2 id="axioms-heading">Axioms</h2>
        <ul id="axioms" class="axioms"></ul>
      </section>
    </section>

    <section id="search-view" class="browse" hidden>
      <aside class="browse-subjects" aria-label="Subjects">
        <nav id="subjects"></nav>
      </aside>
      <div class="browse-main">
        <div class="title-row">
          <h1 id="subject-title">All subjects</h1>
          <span id="result-count" class="count"></span>
        </div>
        <form id="search-form" class="search-form" role="search">
          <label class="sr-only" for="query">Search mathematics</label>
          <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="query" type="search" placeholder="Search theorems and definitions" autocomplete="off" spellcheck="false">
        </form>
        <div class="filters">
          <label class="select"><span class="sr-only">Kind</span><select id="kind"><option value="">All kinds</option><option value="theorem">Theorems</option><option value="definition">Definitions</option><option value="inductive">Structures</option><option value="axiom">Axioms</option><option value="constructor">Constructors</option><option value="recursor">Recursors</option><option value="opaque">Opaque definitions</option><option value="quotient_primitive">Quotient primitives</option></select></label>
          <label class="check"><input id="all" type="checkbox"> Include prerequisites</label>
          <label class="check"><input id="axiom-free" type="checkbox"> No axioms</label>
        </div>
        <div id="results" class="results"></div>
        <div id="search-pages" class="pagination"></div>
      </div>
    </section>

    <section id="detail-view" class="detail" hidden>
      <div id="declaration-heading" class="detail-head"></div>
      <nav id="tabs" class="tabs" aria-label="Declaration sections"></nav>
      <div id="detail-body" class="detail-body"></div>
    </section>

    <section id="graph-view" class="graph" hidden>
      <div class="graph-stage" id="graph-stage" tabindex="0" aria-label="Dependency graph. Arrow keys pan, plus and minus zoom, 0 fits, Escape goes up a level.">
        <canvas id="graph-canvas" aria-hidden="true"></canvas>
      </div>
      <div class="graph-head">
        <nav id="graph-trail" class="trail" aria-label="Graph location"></nav>
        <h1 id="graph-title">Mathematics</h1>
        <p id="graph-meta" class="graph-meta"></p>
      </div>
      <div class="graph-tools">
        <div id="graph-legend" class="legend"></div>
        <div class="zoom" role="group" aria-label="Zoom">
          <button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9"/></svg></button>
          <button type="button" id="zoom-fit" aria-label="Fit to screen" title="Fit to screen"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
          <button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in"><svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
        </div>
      </div>
      <aside id="graph-card" class="graph-card" aria-live="polite"></aside>
      <ul id="graph-list" class="sr-only" aria-label="Nodes in this view"></ul>
    </section>

    <section id="guide-view" class="guide" hidden>
      <h1>Contribute</h1>
      <div id="guide-text" class="prose"></div>
    </section>
  </main>

  <footer class="foot">
    <span id="snapshot-label"></span>
    <button id="reload" class="text-button" type="button">Refresh snapshot</button>
    <a id="catalog-download" download="knowledge.json">Index</a>
    <a id="proof-download" download>Proofs</a>
  </footer>
  <noscript><p class="noscript">This explorer needs JavaScript. The same library is available through <code>python3 -m repository</code>.</p></noscript>
</body>
</html>
