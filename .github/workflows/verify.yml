name: Verify mathematics

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Install elan
        run: |
          curl -sSf https://elan.lean-lang.org/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update
      - name: Verify proofs and contribution checks
        run: |
          set -euo pipefail
          while true; do
            date -u +'%Y-%m-%dT%H:%M:%SZ'
            free -m
            ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,8p'
            sleep 60
          done &
          resources_pid=$!
          trap 'kill "$resources_pid" 2>/dev/null || true' EXIT
          make check
      - name: Retain verified mathematical knowledge
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-mathematics
          path: |
            build/knowledge.json
            build/proofs-*.jsonl
            build/index.json
            build/index-*.sqlite
            build/metamath/
          if-no-files-found: error
          retention-days: 14
